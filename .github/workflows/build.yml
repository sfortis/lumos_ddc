# Builds Lumos with MinGW and runs the unit tests on every push and pull
# request to dev and main. A pushed tag vX.Y.Z also creates a draft release
# with lumos.exe and lumosctl.exe attached (a prerelease tag such as
# vX.Y.Z-beta.N attaches lumos-vX.Y.Z-beta.N.exe instead); the notes are
# written and the release is published by hand. A stable release also gets
# lumos.zip with both exes and the installer lumos-setup.exe, which is built
# from installer/lumos.iss with Inno Setup on a Windows runner and is the
# installer of the winget package (see winget.yml).
name: Build

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - uses: actions/upload-artifact@v7
        with:
          name: lumos
          path: |
            build/lumos.exe
            build/lumosctl.exe
          if-no-files-found: error

  installer:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lumos
          path: dist

      # When the runner image has no Inno Setup 6, it is installed from Chocolatey.
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path src/resource.h -Pattern '^#define APP_VERSION\s+L"(.*)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$version" "/DBuildDir=$PWD\dist" installer\lumos.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: lumos-setup
          path: dist/lumos-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag must match the version the About window shows.
      - name: Check the version
        run: |
          version=$(sed -n 's/^#define APP_VERSION *L"\(.*\)"/\1/p' src/resource.h)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $version in src/resource.h"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: lumos
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: lumos-setup
          path: dist

      # A stable release ships lumos.exe under its plain name, plus lumos.zip
      # with both exes at its root and the installer lumos-setup.exe. A
      # prerelease puts its version in the app's file name, so a beta is not
      # mistaken for a stable build, and has neither the zip nor the installer.
      # lumosctl.exe always keeps its plain name.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          app="dist/lumos.exe"
          zip=""
          case "$GITHUB_REF_NAME" in
            *-*)
              pre="--prerelease"
              app="dist/lumos-$GITHUB_REF_NAME.exe"
              mv dist/lumos.exe "$app"
              ;;
            *)
              zip="dist/lumos.zip dist/lumos-setup.exe"
              (cd dist && zip -X lumos.zip lumos.exe lumosctl.exe)
              ;;
          esac
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag \
              --title "Lumos $GITHUB_REF_NAME" --notes "Release notes to be written."
          fi
          gh release upload "$GITHUB_REF_NAME" "$app" dist/lumosctl.exe $zip --clobber
