# Builds Lumos with MinGW and runs the unit tests on every push and pull
# request to dev and main. A pushed tag vX.Y.Z also creates a draft release
# with lumos.exe and lumosctl.exe attached (a prerelease tag such as
# vX.Y.Z-beta.N attaches lumos-vX.Y.Z-beta.N.exe instead); the notes are
# written and the release is published by hand.
name: Build

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - uses: actions/upload-artifact@v7
        with:
          name: lumos
          path: |
            build/lumos.exe
            build/lumosctl.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag must match the version the About window shows.
      - name: Check the version
        run: |
          version=$(sed -n 's/^#define APP_VERSION *L"\(.*\)"/\1/p' src/resource.h)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $version in src/resource.h"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: lumos
          path: dist

      # A stable release ships lumos.exe under its plain name. A prerelease
      # puts its version in the app's file name, so a beta is not mistaken for
      # a stable build. lumosctl.exe always keeps its plain name.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          app="dist/lumos.exe"
          case "$GITHUB_REF_NAME" in
            *-*)
              pre="--prerelease"
              app="dist/lumos-$GITHUB_REF_NAME.exe"
              mv dist/lumos.exe "$app"
              ;;
          esac
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag \
              --title "Lumos $GITHUB_REF_NAME" --notes "Release notes to be written."
          fi
          gh release upload "$GITHUB_REF_NAME" "$app" dist/lumosctl.exe --clobber
