# Builds Lumos with MinGW and runs the unit tests on every push and pull
# request to dev and main. A pushed tag vX.Y.Z also creates a draft release
# with lumos-vX.Y.Z.exe and lumosctl.exe attached; the notes are written and
# the release is published by hand.
name: Build

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: lumos
          path: |
            build/lumos.exe
            build/lumosctl.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tag must match the version the About window shows.
      - name: Check the version
        run: |
          version=$(sed -n 's/^#define APP_VERSION *L"\(.*\)"/\1/p' src/resource.h)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $version in src/resource.h"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: lumos
          path: dist

      # Only the app carries the version in its file name; lumosctl.exe keeps
      # its plain name so it can be used without renaming.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/lumos.exe "dist/lumos-$GITHUB_REF_NAME.exe"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            pre=""
            case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag \
              --title "Lumos $GITHUB_REF_NAME" --notes "Release notes to be written."
          fi
          gh release upload "$GITHUB_REF_NAME" "dist/lumos-$GITHUB_REF_NAME.exe" dist/lumosctl.exe --clobber
