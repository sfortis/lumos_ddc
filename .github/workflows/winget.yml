# Submits a stable release to the winget community repository
# (microsoft/winget-pkgs) as a new version of the sfortis.Lumos package.
# It runs when a release is published, never for a prerelease, and opens a
# pull request from the sfortis fork of winget-pkgs. The installer is
# lumos.zip, which build.yml attaches to every stable release.
#
# WINGET_TOKEN is a classic PAT of sfortis with the public_repo and workflow
# scopes. The action is pinned to a commit because it receives that token.
name: Publish to winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit, for example v1.4.1
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: sfortis.Lumos
          installers-regex: '^lumos\.zip$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
